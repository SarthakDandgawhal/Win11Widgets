name: Build Win11 Widgets
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - run: dotnet restore Win11Widgets.csproj
      - run: dotnet publish Win11Widgets.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:WindowsPackageType=None -p:WindowsSdkPackageVersion=10.0.19041.57 -o ./artifacts
      - uses: actions/upload-artifact@v4
        with: { name: Win11Widgets-exe, path: ./artifacts/Win11Widgets.exe }
